# Build the Antithesis images on x86-64, validate them, and optionally launch
# an Antithesis run.
#
# Antithesis runs x86-64 only.  Building here (ubuntu-latest is amd64) avoids
# cross-building on ARM machines, where the compose build silently produces
# arm64 images.  snouty launch --config pushes the node, workload and config
# images from this same build, so what runs in Antithesis is what was
# validated here.
#
# Needs (repository or "antithesis" environment settings):
#   secrets.ANTITHESIS_API_KEY     Antithesis API key (launch only)
#   secrets.ANTITHESIS_GAR_KEY     Artifact Registry JSON key from Antithesis
#   vars.ANTITHESIS_TENANT         e.g. pgedge
#   vars.ANTITHESIS_REPOSITORY     Artifact Registry path for images

name: Antithesis

on:
  # TEMPORARY: lets the workflow run from a-test before it is on the default
  # branch (workflow_dispatch needs that).  Push runs only build and
  # validate: inputs.launch is empty, so nothing is launched.  Remove
  # before merging.
  push:
    branches: [a-test]
  workflow_dispatch:
    inputs:
      launch:
        description: "Submit a run after building and validating"
        type: boolean
        default: false
      duration:
        description: "Run duration in minutes"
        type: string
        default: "15"
      description:
        description: "Run description (default: branch and commit)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: antithesis-${{ github.ref }}
  cancel-in-progress: false

env:
  SNOUTY_VERSION: v0.7.2
  SNOUTY_SHA256: 6ac9f7c4e0b40947c12c29f298891e1cd285993c672caf401bb325d89301730f
  SNOUTY_CONTAINER_ENGINE: docker
  NO_COLOR: "1"
  CONFIG_DIR: antithesis/config

jobs:
  antithesis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: antithesis
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Set up docker compose
        uses: docker/setup-compose-action@364cc21a5de5b1ee4a7f5f9d3fa374ce0ccde746 # v1

      - name: Install snouty
        run: |
          set -euo pipefail
          tarball="snouty-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/antithesishq/snouty/releases/download/${SNOUTY_VERSION}/${tarball}"
          echo "${SNOUTY_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xJf "/tmp/${tarball}" -C /tmp
          sudo install -m 755 /tmp/snouty-x86_64-unknown-linux-gnu/snouty /usr/local/bin/snouty
          snouty --version

      - name: Build images
        run: docker compose -f "${CONFIG_DIR}/docker-compose.yaml" build

      - name: Check images are amd64
        run: |
          set -euo pipefail
          for img in spock-node:latest spock-workload:latest; do
            arch="$(docker image inspect "${img}" --format '{{.Architecture}}')"
            echo "${img}: ${arch}"
            if [ "${arch}" != amd64 ]; then
              echo "::error::${img} is ${arch}, Antithesis needs amd64"
              exit 1
            fi
          done

      - name: Validate
        run: snouty validate "${CONFIG_DIR}" --timeout 600

      # Same login as Antithesis's demo CI: the registry key Antithesis
      # provides, as a service-account JSON key.
      - name: Log in to Artifact Registry
        if: ${{ inputs.launch }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_GAR_KEY }}

      - name: Launch Antithesis run
        if: ${{ inputs.launch }}
        env:
          ANTITHESIS_API_KEY: ${{ secrets.ANTITHESIS_API_KEY }}
          ANTITHESIS_TENANT: ${{ vars.ANTITHESIS_TENANT }}
          ANTITHESIS_REPOSITORY: ${{ vars.ANTITHESIS_REPOSITORY }}
          DURATION: ${{ inputs.duration }}
          RUN_DESCRIPTION: ${{ inputs.description }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${DURATION}" in
            '' | *[!0-9]*) echo "::error::duration must be a whole number of minutes"; exit 1 ;;
          esac
          description="${RUN_DESCRIPTION:-${BRANCH} ${SHA:0:8}}"
          snouty launch --json \
            --webhook basic_test \
            --config "${CONFIG_DIR}" \
            --duration "${DURATION}" \
            --source spock \
            --test-name "spock-${BRANCH}" \
            --description "${description}" > /tmp/launch.json
          cat /tmp/launch.json
          # snouty may print the request parameters ahead of the JSON
          # response, so pick the run ID out instead of parsing the whole
          # output as JSON.
          run_id="$(grep -oE '"runId": *"[^"]+"' /tmp/launch.json | sed -E 's/.*"([^"]+)"$/\1/' || true)"
          if [ -z "${run_id}" ]; then
            echo "::error::no runId in snouty launch output"
            exit 1
          fi
          {
            echo "### Antithesis run submitted"
            echo
            echo "- Run ID: \`${run_id}\`"
            echo "- Branch: \`${BRANCH}\` (${SHA:0:8})"
            echo "- Duration: ${DURATION} minutes"
          } >> "${GITHUB_STEP_SUMMARY}"
