name: Spockbench tests
run-name: Running Spockbench

on:
  workflow_dispatch:
  push:


permissions:
  contents: read

jobs:
  pull-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        pgver: [15, 16, 17]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout spock
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Checkout spockbench
        uses: actions/checkout@v4
        with:
          repository: pgedge/spockbench
          token: ${{ secrets.GITHUB_TOKEN }}
          path: spockbench
          ref: master

      - name: Add permissions
        run: |
          sudo chmod -R a+w ${GITHUB_WORKSPACE}

      - name: Set up Docker
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Set up docker compose
        uses: docker/setup-compose-action@364cc21a5de5b1ee4a7f5f9d3fa374ce0ccde746 # v1.2.0
        with:
          version: latest

      - name: Build docker container
        run: |
          cd ${GITHUB_WORKSPACE}/
          docker build \
            --build-arg PGVER=${{ matrix.pgver }} \
            -t spock -f tests/Dockerfile.el9 .

      - name: Start docker
        run: |
          cd ${GITHUB_WORKSPACE}/tests/
          rm -f ${GITHUB_WORKSPACE}/ready-* ${GITHUB_WORKSPACE}/confirmed-* ${GITHUB_WORKSPACE}/done-*
          export PGVER=${{ matrix.pgver }}
          docker compose up

      - name: Check spockbench output
        run: |
          cd ${GITHUB_WORKSPACE}/tests
          ./check-outputs.sh

